buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    minecraft.mavenizer(repositories)
}

apply from: '../common.gradle'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21-51.0.33')
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

jar {
    manifest {
        attributes([
                "TweakClass": "org.spoongepowered.asm.launch.MixinTweaker",
                "MixinConfigs": "mixins.clickthrough.json",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "NexSqaud",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

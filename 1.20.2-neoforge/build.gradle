buildscript {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'base'
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.+'
}

apply from: '../common.gradle'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:20.2.86"
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_license         : mod_license,
        mod_version         : mod_version,
        mod_authors         : mod_authors,
        mod_description     : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/mods.toml") {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "TweakClass": "org.spoongepowered.asm.launch.MixinTweaker",
                "MixinConfigs": "mixins.clickthrough.json",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "NexSqaud",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}